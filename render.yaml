services:
  - type: web
    name: deepfake-scanner-safety-center
    runtime: node
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: DATABASE_POOLER_MODE
        value: transaction
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_QUOTA_COOLDOWN_MS
        value: '300000'
      - key: AI_PROVIDER_COOLDOWN_MS
        value: '60000'

# Hệ thống Quản trị & Tài khoản Người dùng (Cấu hình trên Render > Environment):
# DATABASE_URL: Internal Database URL từ dịch vụ Render PostgreSQL (tạo miễn phí)
# ADMIN_EMAIL: Địa chỉ email của quản trị viên đầu tiên
# ADMIN_PASSWORD: Mật khẩu quản trị viên (tối thiểu 12 ký tự)
