name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - name: Repository-level V5 checks
        run: npm run verify:v5
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
